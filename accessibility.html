<!-- ACCESSIBILITY BUTTON -->
<button
    id="accessibility-toggle"
    class="accessibility-toggle"
    type="button"
    aria-label="Open accessibility settings"
    aria-expanded="false"
    aria-controls="accessibility-panel"
>
    <img
        src="images/accessibility.png"
        alt=""
        aria-hidden="true"
    >
</button>


<!-- ACCESSIBILITY PANEL -->
<div
    id="accessibility-panel"
    class="accessibility-panel"
    role="dialog"
    aria-label="Accessibility settings"
    hidden
>

    <div class="accessibility-header">

        <h2>Accessibility</h2>

        <button
            id="accessibility-close"
            class="accessibility-close"
            type="button"
            aria-label="Close accessibility settings"
        >
            ×
        </button>

    </div>


    <div class="accessibility-options">

        <div class="accessibility-option">

            <span>Text size</span>

            <div class="accessibility-size-controls">

                <button
                    type="button"
                    id="text-decrease"
                    aria-label="Decrease text size"
                >
                    A−
                </button>

                <button
                    type="button"
                    id="text-increase"
                    aria-label="Increase text size"
                >
                    A+
                </button>

            </div>

        </div>


        <button
            class="accessibility-action"
            type="button"
            id="toggle-contrast"
            aria-pressed="false"
        >
            High contrast
        </button>


        <button
            class="accessibility-action"
            type="button"
            id="toggle-links"
            aria-pressed="false"
        >
            Underline links
        </button>


        <button
            class="accessibility-action"
            type="button"
            id="toggle-readable"
            aria-pressed="false"
        >
            Readable font
        </button>


        <button
            class="accessibility-action"
            type="button"
            id="toggle-motion"
            aria-pressed="false"
        >
            Reduce motion
        </button>


        <button
            class="accessibility-reset"
            type="button"
            id="accessibility-reset"
        >
            RESET SETTINGS
        </button>

    </div>

</div>
